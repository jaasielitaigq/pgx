name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go test ./... -v -count=1 -timeout 60s
      - run: go vet ./...
      - run: go test ./... -race -count=1 -timeout 120s
